<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="100%" stop-color="#0d0303"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#602810"/>
      <stop offset="60%" stop-color="#3c1507"/>
      <stop offset="100%" stop-color="#210802"/>
    </radialGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="60%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
  </defs>

  <!-- Background Circle (Safe Zone friendly) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular accent border -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ffb703" stroke-width="4" opacity="0.4"/>

  <!-- Sunflower Petals Group (16 petals) -->
  <g transform="translate(256, 256)">
    <!-- Outer Petals Ring -->
    <g id="petals">
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(22.5)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(45)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(67.5)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(90)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(112.5)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(135)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(157.5)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(180)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(202.5)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(225)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(247.5)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(270)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(292.5)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(315)" />
      <path d="M 0,-60 C -22,-120 -24,-175 0,-215 C 24,-175 22,-120 0,-60 Z" fill="url(#petalGrad)" transform="rotate(337.5)" />
    </g>

    <!-- Seed Center Core -->
    <circle cx="0" cy="0" r="85" fill="url(#centerGrad)" stroke="#ffb703" stroke-width="4" stroke-opacity="0.6"/>
    <!-- Seed texture details -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#2a0808" stroke-width="3" stroke-dasharray="6,6" opacity="0.7"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="4,6" opacity="0.6"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#e07a5f" stroke-width="2" stroke-dasharray="3,5" opacity="0.5"/>
    <!-- Center Heart Accent -->
    <path d="M 0,10 C -16,-10 -28,-14 -28,-26 C -28,-38 -16,-46 0,-34 C 16,-46 28,-38 28,-26 C 28,-14 16,-10 0,10 Z" fill="#9b2226" transform="scale(0.7)"/>
  </g>
</svg>
